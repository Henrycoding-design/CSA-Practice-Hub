name: Structure Check

on:
  push:
    paths:
      - ".github/workflows/structure-check.yml"
      - "**"
  pull_request:
    paths:
      - ".github/workflows/structure-check.yml"
      - "**"

jobs:
  structure-check:
    name: Verify required directories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository structure
        shell: pwsh
        run: |
          $required = @(
            "frqs",
            "frqs/answers",
            "frqs/review",
            "frqs/questions",
            "syntax-review",
            "error-log",
            "resources",
            "plans",
            "templates",
            ".github/ISSUE_TEMPLATE",
            ".github/workflows"
          )

          $missing = @()

          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Container)) {
              $missing += $path
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing required directories: $($missing -join ', ')"
            exit 1
          }

          Write-Host "Repository structure looks good."
