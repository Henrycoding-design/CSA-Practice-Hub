name: Lychee

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  resource-link-check:
    name: Check resource links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lychee on resources
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress "resources/**/*.md" "frqs/questions/links.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
