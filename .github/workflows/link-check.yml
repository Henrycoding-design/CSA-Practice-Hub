name: Link Check

on:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:

jobs:
  link-check:
    name: Check Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress "./**/*.md" --exclude-path "frqs/template" --exclude-path "templates"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
