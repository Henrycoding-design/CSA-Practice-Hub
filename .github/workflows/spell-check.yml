name: Spell Check

on:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/spell-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/spell-check.yml"
  workflow_dispatch:

jobs:
  spell-check:
    name: Check spelling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CSpell
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: "**/*.md"
