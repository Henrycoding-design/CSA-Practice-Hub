name: Resource request
description: Suggest a video, practice site, textbook, IDE, or official link.
title: "[Resource]: "
labels:
  - resource
body:
  - type: input
    id: resource-name
    attributes:
      label: Resource name
      placeholder: CodingBat Java
    validations:
      required: true
  - type: input
    id: resource-link
    attributes:
      label: Resource link
      placeholder: https://codingbat.com/java
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Official
        - College Board
        - Practice
        - CodingBat
        - Runestone
        - IDEs
        - BlueJ
        - IntelliJ
        - Replit
        - Video
        - Textbook
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should this be added?
      description: Explain how it helps AP CSA students.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: The resource is appropriate for AP CSA students.
          required: true
        - label: The link is public and working.
          required: true
